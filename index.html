<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Resume Game</title>
    <style>
        /* Basic reset */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: sans-serif;
        }
        #game {
            display: block;
            margin: 0 auto;
            background: #222;
            /* Ensure crisp pixel rendering */
            image-rendering: pixelated;
            outline: none;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <canvas id="game" width="768" height="512" tabindex="0"></canvas>
    <div id="loading">Loading…</div>
    <script src="game.js"></script>
</body>
</html>
